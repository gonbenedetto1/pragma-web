<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hexágono rounded corners, bordo -->
  <polygon points="21,12 43,12 54,32 43,52 21,52 10,32"
           fill="#6b1c1c"
           stroke="#6b1c1c"
           stroke-width="10"
           stroke-linejoin="round"
           stroke-linecap="round"/>
  <!-- Stem del "p" (más ancho, bordes redondeados) -->
  <rect x="21" y="18" width="8" height="30" rx="4" fill="#f7f6f2"/>
  <!-- Bowl del "p" (elipse ligeramente ovalada) -->
  <ellipse cx="34" cy="26" rx="9" ry="8" fill="#f7f6f2"/>
  <!-- Counter interior (bordo) -->
  <ellipse cx="35" cy="26" rx="3" ry="3.5" fill="#6b1c1c"/>
</svg>
